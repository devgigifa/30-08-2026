<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GN - Nossas memórias. Colecionando os melhores momentos juntos." />
  <title>GN - Nossas memórias</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
  
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/main.css">
  
  <script src="../js/menuhamb.js" defer></script>
  <script src="../js/app.js" defer></script>
  <script src="../js/main.js" defer></script>
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div class="hero">
      <img src="../assets/2025-12-14_IMG11.jpg" alt="Giovanna e Nicolas">
      <div class="hero-content">
        <span class="hero-badge">2023 — 2026</span>
        <h1 class="hero-title">Giovanna &amp; Nicolas</h1>
        <p class="hero-subtitle">três anos colecionando os melhores momentos</p>

        <div class="counter" id="counter">
          <!-- preenchido via JS a partir de DATA_INICIO -->
        </div>
      </div>
    </div>

    <section>
      <h2 class="section-title">Fotos</h2>
      <div class="carousel-wrapper">
        <button class="carousel-nav left">&#8592;</button>
        <div class="carousel" id="carousel-photos">
           <!-- Filled dynamically via JS (carousels.json) -->
        </div>
        <button class="carousel-nav right">&#8594;</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Linha do tempo</h2>
      <div class="carousel-wrapper">
        <button class="carousel-nav left">&#8592;</button>
        <div class="carousel" id="carousel-start">
          <!-- Filled dynamically via JS (carousels.json) -->
        </div>
        <button class="carousel-nav right">&#8594;</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Músicas que lembram meu momoi</h2>
      <div class="carousel-wrapper">
        <button class="carousel-nav left">&#8592;</button>
        <div class="carousel" id="carousel-songs">
          <!-- Filled dynamically via JS (carousels.json) -->
        </div>
        <button class="carousel-nav right">&#8594;</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Que mandei pro meu momoi</h2>
      <div class="carousel-wrapper">
        <button class="carousel-nav left">←</button>
        <div class="carousel" id="carousel-sent">
          <!-- Filled dynamically via JS (carousels.json) -->
        </div>
        <button class="carousel-nav right">→</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Que recebi do meu momoi</h2>
      <div class="carousel-wrapper">
        <button class="carousel-nav left">←</button>
        <div class="carousel" id="carousel-received">
          <!-- Filled dynamically via JS (carousels.json) -->
        </div>
        <button class="carousel-nav right">→</button>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>
  <div id="app-modal"></div>
</body>
</html>
