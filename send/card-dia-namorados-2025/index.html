<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz dia dos namorados</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&family=Petemoss&family=Roboto:ital,wght@0,100..900;1,100..900&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="envelope">
        <div class="envelope-lid"></div>
        <div class="envelope-lid envelope-lid-secondary"></div>
        <div class="card-wrapper">
            <div class="card">
                <div class="card-cover">
                    <div class="card-side card-side-primary">
                        <h1 class="card-title">
                            <span class="card-title-secondary">Feliz</span>
                            <span class="card-title-secondary">Dia dos</span>
                            <span class="card-title-main">Namorados <span
                                    class="card-title-apostrophe">❤️</span></span>
                        </h1>
                    </div>
                    <div class="card-side card-side-secondary"></div>
                </div>
                <div class="card-body">
                    <p>Para o amor da minha vida,</p>
                    <br>
                    <p>A vida é feliz com você
                        <br>
                        meu namorado
                        <br>
                        meu melhor amigo
                        <br>
                        meu amor
                        <br>
                        meu coração
                        <br>
                        minha alma gêmea
                        <br>
                        meu para sempre
                        <br>
                        meu tudo
                        <br>
                        Serei sua para sempre — Com amor, Gigi
                    </p>
                    <p>Feliz dia dos namorados!</p>
                </div>
            </div>
        </div>
        <div class="heart-seal"></div> </div>

       <script  src="./script.js"></script>
</body>
</html>
